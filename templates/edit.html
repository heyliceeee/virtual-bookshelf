{% extends "base.html" %}
{% block content %}

<h1 class="mb-4">Edit Book</h1>

<form method="POST" class="card p-4 shadow-sm">

  <div class="mb-3">
    <label class="form-label">Title</label>
    <input type="text" name="title" class="form-control" value="{{ book.title }}" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Author</label>
    <input type="text" name="author" class="form-control" value="{{ book.author }}" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Rating</label>
    <select name="rating" class="form-select" required>
      <option value="1" {% if book.rating == 1 %}selected{% endif %}>⭐</option>
      <option value="2" {% if book.rating == 2 %}selected{% endif %}>⭐⭐</option>
      <option value="3" {% if book.rating == 3 %}selected{% endif %}>⭐⭐⭐</option>
      <option value="4" {% if book.rating == 4 %}selected{% endif %}>⭐⭐⭐⭐</option>
      <option value="5" {% if book.rating == 5 %}selected{% endif %}>⭐⭐⭐⭐⭐</option>
    </select>
  </div>

  <button type="submit" class="btn btn-primary">
    <i class="bi bi-save"></i> Save Changes
  </button>
</form>

{% endblock %}
